# XcodeGen spec — generates Hearth.xcodeproj on a Mac:
#   brew install xcodegen && cd family/ios && xcodegen generate && open Hearth.xcodeproj
# Then: set your Team in each target's Signing & Capabilities, and change the bundle ID prefix + App Group
# (search "com.example.hearth") to your own reverse-domain.
name: Hearth
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hearth:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: HearthWidget
      - target: HearthWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Hearth shows your family's calendars (Google, Outlook, TeamSnap, GameChanger) in one place.
    entitlements:
      path: iOS/Hearth.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.hearth]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hearth
  HearthWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared/Summary.swift, Shared/Color+Hex.swift]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HearthWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.hearth]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hearth.widget
  HearthWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared/Summary.swift, Shared/Color+Hex.swift]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        WKCompanionAppBundleIdentifier: com.example.hearth
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hearth.watchkitapp
  HearthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Hearth
schemes:
  Hearth:
    build:
      targets:
        Hearth: all
    test:
      targets: [HearthTests]
